exchanges:
  binance:
    api_key: "${BINANCE_API_KEY}"
    api_secret: "${BINANCE_API_SECRET}"
    testnet: true

risk:
  max_position_pct: 0.08
  max_daily_loss_pct: 0.05
  max_concurrent_positions: 5
  circuit_breaker_drawdown_pct: 0.15
  max_order_size_usd: 500
  min_order_size_usd: 10
  max_price_deviation_pct: 0.02
  stop_loss_pct: 0.005
  trailing_stop_activate_pct: 0.02
  trailing_stop_distance_pct: 0.03
  take_profit_1r_pct: 0.0015
  take_profit_target_pct: 0.003

live_trading: false

alerts:
  telegram_token: ""
  telegram_chat_id: ""
  discord_webhook: ""

strategies:
  scalping:
    enabled: true
    symbols: ["BTCUSDT", "ETHUSDT"]
    order_book_depth: 5
    position_size_usd: 100

  mean-reversion:
    enabled: true
    symbols: ["BTCUSDT", "ETHUSDT"]
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    bb_period: 20
    bb_stddev: 2.0
    position_size_usd: 100

  tick-momentum:
    enabled: true
    symbols: ["BTCUSDT", "ETHUSDT"]
    order_book_depth: 5
    position_size_usd: 100

research:
  update_interval_seconds: 60
  sentiment_sources: ["rss", "newsapi"]
  signal_min_confidence: 0.6
