exchanges:
  binance:
    api_key: "${BINANCE_API_KEY}"
    api_secret: "${BINANCE_API_SECRET}"
    testnet: true

risk:
  max_position_pct: 0.05          # ~$50/trade on $1000 equity (mean-reversion sizing)
  max_daily_loss_pct: 0.03        # halt + flatten for the day at -3%
  daily_profit_target_pct: 0.03   # bank + flatten for the day at +3%
  max_concurrent_positions: 3
  circuit_breaker_drawdown_pct: 0.15
  max_order_size_usd: 500
  min_order_size_usd: 10
  max_price_deviation_pct: 0.02
  stop_loss_pct: 0.008            # cut a loser at -0.8%
  trailing_stop_activate_pct: 0.004  # arm trailing once +0.4% (clears fees)
  trailing_stop_distance_pct: 0.002  # trail 0.2% below peak
  take_profit_1r_pct: 0.005       # scale-out: sell 50% into strength at +0.5%
  take_profit_target_pct: 0.01    # hard take-profit backstop at +1.0% (rest runs on trailing)
  crash_guard_drop_pct: 0.02      # block NEW buys if price fell >2%...
  crash_guard_lookback_min: 30    # ...over the last 30 minutes (0 = disabled)

live_trading: false

alerts:
  telegram_token: ""
  telegram_chat_id: ""
  discord_webhook: ""

strategies:
  scalping:
    enabled: false
    symbols: ["BTCUSDT", "ETHUSDT"]
    order_book_depth: 5
    position_size_usd: 100

  mean-reversion:
    enabled: true
    symbols: ["ETHUSDT"]
    rsi_period: 14
    rsi_oversold: 35
    rsi_overbought: 55
    bb_period: 20
    bb_stddev: 1.2
    position_size_usd: 50

  grid:
    enabled: true
    symbols: ["BTCUSDT"]
    rsi_period: 2
    order_book_depth: 2
    position_size_usd: 50

  tick-momentum:
    enabled: false
    symbols: ["BTCUSDT", "ETHUSDT"]
    order_book_depth: 5
    position_size_usd: 100

research:
  update_interval_seconds: 60
  sentiment_sources: ["rss", "newsapi"]
  signal_min_confidence: 0.6
