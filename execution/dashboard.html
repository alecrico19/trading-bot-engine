<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Bot — Live Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    background: #0a0a1a;
    color: #c0caf5;
    padding: 20px;
    min-height: 100vh;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; background: #1a1a2e; border-radius: 12px;
    margin-bottom: 16px;
  }
  .header h1 { font-size: 22px; color: #ffd700; }
  .status-dot {
    width: 12px; height: 12px; border-radius: 50%; display: inline-block;
    margin-right: 8px; animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
  }
  .status-online { background: #00ff00; }
  .status-offline { background: #ff0000; }
  .status-paused { background: #ffa500; }
  .status-breached { background: #ff0000; animation: none; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
  }
  .card {
    background: #1a1a2e; border-radius: 12px; padding: 20px;
    border: 1px solid #2a2a4a;
  }
  .card h2 {
    font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
    color: #7aa2f7; margin-bottom: 16px;
  }
  .stat { display: flex; justify-content: space-between; padding: 6px 0; }
  .stat .label { color: #565f89; }
  .stat .value { font-weight: bold; }
  .green { color: #9ece6a; }
  .red { color: #f7768e; }
  .blue { color: #7aa2f7; }
  .yellow { color: #e0af68; }
  .big-number { font-size: 36px; font-weight: bold; }
  .pnl-positive { color: #9ece6a; }
  .pnl-negative { color: #f7768e; }
  .position-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
    padding: 8px 0; border-bottom: 1px solid #2a2a4a; font-size: 13px;
  }
  .position-row:last-child { border-bottom: none; }
  .signal-row {
    display: flex; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid #2a2a4a; font-size: 13px;
  }
  .signal-row:last-child { border-bottom: none; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: bold;
  }
  .badge-long { background: #1a3a1a; color: #9ece6a; }
  .badge-short { background: #3a1a1a; color: #f7768e; }
  .badge-running { background: #1a3a1a; color: #9ece6a; }
  .badge-paused { background: #3a2a1a; color: #e0af68; }
  .footer {
    text-align: center; padding: 16px; color: #565f89; font-size: 12px;
    margin-top: 16px;
  }
  #last-update { color: #7aa2f7; }
  .flash { animation: flash 0.3s ease; }
  @keyframes flash { 0% { background: #2a2a5a; } 100% { background: #1a1a2e; } }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:12px;">
    <span id="status-dot" class="status-dot status-offline"></span>
    <h1>Trading Bot</h1>
  </div>
  <div style="text-align:right;font-size:13px;color:#565f89;">
    Last update: <span id="last-update">—</span>
  </div>
</div>

<div class="grid">
  <!-- Equity Card -->
  <div class="card">
    <h2>Equity & P&L</h2>
    <div class="big-number" id="equity">$—</div>
    <div class="stat"><span class="label">Daily P&L</span><span class="value" id="daily-pnl">$—</span></div>
    <div class="stat"><span class="label">Trades</span><span class="value" id="trades">—</span></div>
    <div class="stat"><span class="label">Win Rate</span><span class="value" id="winrate">—</span></div>
    <div class="stat"><span class="label">Active Signals</span><span class="value" id="signals">—</span></div>
  </div>

  <!-- Positions Card -->
  <div class="card">
    <h2>Positions (<span id="pos-count">0</span>)</h2>
    <div id="positions-list" style="color:#565f89;">No open positions</div>
  </div>

  <!-- Strategies Card -->
  <div class="card">
    <h2>Strategies</h2>
    <div id="strategies-list" style="color:#565f89;">—</div>
  </div>

  <!-- Alerts Card -->
  <div class="card" id="alerts-card">
    <h2>Status</h2>
    <div id="alerts-content" style="color:#565f89;">—</div>
  </div>
</div>

<div class="footer">
  Auto-refreshing every 1s — API: <span style="color:#7aa2f7;">localhost:8080</span>
</div>

<script>
const API = 'http://localhost:8080';
let lastTradeCount = 0;

async function fetchData() {
  try {
    const resp = await fetch(API + '/status');
    const data = await resp.json();
    updateUI(data);
    document.getElementById('status-dot').className = 'status-dot status-online';
  } catch (e) {
    document.getElementById('status-dot').className = 'status-dot status-offline';
  }
}

function updateUI(d) {
  document.getElementById('last-update').textContent = new Date().toLocaleTimeString();

  // Status dot
  if (d.breached) {
    document.getElementById('status-dot').className = 'status-dot status-breached';
  } else if (!d.running) {
    document.getElementById('status-dot').className = 'status-dot status-paused';
  } else {
    document.getElementById('status-dot').className = 'status-dot status-online';
  }

  // Equity
  document.getElementById('equity').textContent = '$' + (d.equity || 0).toLocaleString();
  const equityEl = document.getElementById('equity');

  // Daily P&L
  const pnl = d.daily_pnl || 0;
  const pnlEl = document.getElementById('daily-pnl');
  pnlEl.textContent = (pnl >= 0 ? '+$' : '-$') + Math.abs(pnl).toFixed(2);
  pnlEl.className = 'value ' + (pnl >= 0 ? 'pnl-positive' : 'pnl-negative');

  // Trades
  const tradesEl = document.getElementById('trades');
  tradesEl.textContent = d.trades || 0;
  if (d.trades !== lastTradeCount) {
    const card = tradesEl.closest('.card');
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 300);
    lastTradeCount = d.trades;
  }

  // Win rate
  const wins = d.wins || 0;
  const wr = d.trades > 0 ? ((wins / d.trades) * 100).toFixed(0) + '%' : '—';
  document.getElementById('winrate').textContent = wr;

  // Signals
  document.getElementById('signals').textContent = d.signals || 0;

  // Positions
  fetch(API + '/positions').then(r => r.json()).then(positions => {
    const list = document.getElementById('positions-list');
    document.getElementById('pos-count').textContent = positions.length;
    if (!positions.length) {
      list.innerHTML = '<span style="color:#565f89;">No open positions</span>';
      return;
    }
    let html = '<div class="position-row" style="color:#565f89;font-size:11px;"><span>PAIR</span><span>SIDE</span><span>SIZE</span><span>PNL</span></div>';
    positions.forEach(p => {
      const sideBadge = p.side === 'long' ? 'badge-long' : 'badge-short';
      const pnlClass = (p.unrealized_pnl || 0) >= 0 ? 'green' : 'red';
      const pnlSign = (p.unrealized_pnl || 0) >= 0 ? '+' : '';
      html += `<div class="position-row">
        <span>${p.symbol}</span>
        <span><span class="badge ${sideBadge}">${p.side.toUpperCase()}</span></span>
        <span>${(p.amount || 0).toFixed(4)}</span>
        <span class="${pnlClass}">${pnlSign}$${(p.unrealized_pnl || 0).toFixed(2)}</span>
      </div>`;
    });
    list.innerHTML = html;
  }).catch(() => {});

  // Strategies
  const strats = d.strategies || [];
  const stratList = document.getElementById('strategies-list');
  let stratHtml = '';
  strats.forEach(s => {
    const badge = d.running && !d.breached ? 'badge-running' : 'badge-paused';
    stratHtml += `<div class="stat">
      <span>${s}</span>
      <span class="badge ${badge}">${d.running && !d.breached ? 'RUNNING' : 'PAUSED'}</span>
    </div>`;
  });
  stratList.innerHTML = stratHtml || '<span style="color:#565f89;">—</span>';

  // Alerts / status
  const alerts = document.getElementById('alerts-content');
  if (d.breached) {
    alerts.innerHTML = '<div style="color:#f7768e;font-size:18px;">■ CIRCUIT BREAKER ACTIVE</div><div style="color:#565f89;">Trading halted — kill switch or daily loss limit</div>';
    document.getElementById('alerts-card').style.borderColor = '#f7768e';
  } else {
    document.getElementById('alerts-card').style.borderColor = '#2a2a4a';
    alerts.innerHTML = '<div style="color:#9ece6a;font-size:18px;">● All Systems Normal</div>';
  }
}

fetchData();
setInterval(fetchData, 1000);
</script>
</body>
</html>
